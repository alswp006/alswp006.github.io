  <text x="400" y="99" text-anchor="middle" font-size="11" fill="#a7d4c1">accepts: [ … ] · 받을 수 있는 모든 방법</text>
  <line x1="400" y1="116" x2="190" y2="158" stroke="#5fb3a8" stroke-width="1.5"/>
  <line x1="400" y1="116" x2="610" y2="158" stroke="#5fb3a8" stroke-width="1.5"/>
  <rect x="60" y="162" width="260" height="66" rx="9" fill="#e8f0f2" stroke="#1a4d5c" stroke-width="1.5"/>
