  <text x="400" y="376" text-anchor="middle" font-size="11" fill="#2f6b5b" font-weight="600">선택한 옵션으로 결제 서명 생성</text>
  <text x="400" y="395" text-anchor="middle" font-size="11" fill="#9ca3af">그림 — 카드망은 "이 카드 되나요?", x402는 "이 중에 네가 낼 수 있는 걸로 골라"</text>
