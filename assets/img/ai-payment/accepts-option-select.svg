  </defs>
  <text x="400" y="32" text-anchor="middle" font-size="14" fill="#6b7280" font-weight="500">402 응답의 accepts 배열 — 서버가 던지고, 클라이언트가 고른다</text>
  <rect x="280" y="56" width="240" height="56" rx="10" fill="#1a4d5c"/>
