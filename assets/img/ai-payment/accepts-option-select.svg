  <text x="190" y="188" text-anchor="middle" font-size="13" fill="#2a2a2a" font-weight="600">Base · USDC</text>
  <text x="190" y="210" text-anchor="middle" font-size="11" fill="#6b7280">maxAmountRequired 5000 (=0.005)</text>
  <rect x="480" y="162" width="260" height="66" rx="9" fill="#e8f0f2" stroke="#1a4d5c" stroke-width="1.5"/>
  <text x="500" y="188" font-size="12" fill="#2c7a8c" font-weight="700">옵션 B</text>
  <text x="610" y="188" text-anchor="middle" font-size="13" fill="#2a2a2a" font-weight="600">Polygon · USDT</text>
  <text x="610" y="210" text-anchor="middle" font-size="11" fill="#6b7280">maxAmountRequired 5000 (=0.005)</text>
  <line x1="190" y1="230" x2="370" y2="280" stroke="#5fb3a8" stroke-width="1.5" marker-end="url(#m1mint)"/>
  <line x1="610" y1="230" x2="430" y2="280" stroke="#5fb3a8" stroke-width="1.5" marker-end="url(#m1mint)"/>
  <rect x="270" y="284" width="260" height="54" rx="9" fill="#fdf3ee" stroke="#d97757" stroke-width="1.5"/>
  <text x="290" y="312" font-size="17" fill="#d97757">&#129302;</text>
  <text x="412" y="308" text-anchor="middle" font-size="12.5" fill="#2a2a2a" font-weight="600">클라이언트 — 내 지갑에 맞는 옵션 선택</text>
  <text x="412" y="326" text-anchor="middle" font-size="11" fill="#6b7280">보유 토큰·네트워크 기준</text>
  <line x1="400" y1="340" x2="400" y2="360" stroke="#5fb3a8" stroke-width="1.5" marker-end="url(#m1mint)"/>
