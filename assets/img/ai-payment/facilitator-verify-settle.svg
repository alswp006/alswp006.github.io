<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;">
  <rect width="820" height="430" fill="#fafafa" rx="12"/>
  <defs>
    <marker id="d6mint" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#5fb3a8"/></marker>
    <marker id="d6teal" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2c7a8c"/></marker>
    <marker id="d6green" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4a8b6f"/></marker>
  </defs>
  <text x="410" y="30" text-anchor="middle" font-size="14" fill="#6b7280" font-weight="500">Facilitator의 두 엔드포인트 — 검증은 공짜, 정산만 가스</text>

  <rect x="70" y="56" width="180" height="44" rx="8" fill="#e8f1f4" stroke="#2c7a8c" stroke-width="1.5"/>
  <text x="90" y="84" font-size="18" fill="#2c7a8c">&#128421;</text>
  <text x="170" y="83" text-anchor="middle" font-size="13" fill="#2a2a2a" font-weight="600">API 서버</text>

  <rect x="320" y="56" width="180" height="44" rx="8" fill="#e8f1f4" stroke="#2c7a8c" stroke-width="1.5"/>
  <text x="340" y="84" font-size="18" fill="#2c7a8c">&#9881;</text>
  <text x="420" y="83" text-anchor="middle" font-size="13" fill="#2a2a2a" font-weight="600">Facilitator</text>

  <rect x="570" y="56" width="180" height="44" rx="8" fill="#dbe9ed" stroke="#1a4d5c" stroke-width="1.5"/>
  <text x="590" y="84" font-size="18" fill="#1a4d5c">&#9939;</text>
  <text x="670" y="83" text-anchor="middle" font-size="13" fill="#2a2a2a" font-weight="600">블록체인</text>

  <line x1="160" y1="106" x2="160" y2="392" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="410" y1="106" x2="410" y2="392" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="660" y1="106" x2="660" y2="392" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <rect x="40" y="124" width="740" height="120" rx="8" fill="#f1f9f6" stroke="#cfe9e0" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="54" y="125" width="150" height="18" rx="9" fill="#d6ede5"/>
  <text x="129" y="138" text-anchor="middle" font-size="10" fill="#2f6b5b" font-weight="600">검증 (verify) · 오프체인</text>

  <line x1="160" y1="166" x2="410" y2="166" stroke="#5fb3a8" stroke-width="2" marker-end="url(#d6mint)"/>
  <rect x="178" y="155" width="218" height="22" rx="4" fill="#ecf6f3"/>
  <text x="287" y="170" text-anchor="middle" font-size="11" fill="#1a4d5c" font-weight="500">POST /verify (서명·nonce·금액)</text>

  <rect x="300" y="186" width="220" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="410" y="202" text-anchor="middle" font-size="11" fill="#78350f" font-weight="600">오프체인 검증</text>
  <text x="410" y="215" text-anchor="middle" font-size="10" fill="#78350f">가스 0 · 즉시</text>

  <line x1="410" y1="234" x2="160" y2="234" stroke="#4a8b6f" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#d6green)"/>
  <rect x="178" y="223" width="218" height="22" rx="4" fill="#f0f7f3"/>
  <text x="287" y="238" text-anchor="middle" font-size="11" fill="#4a8b6f" font-weight="500">유효함 (자금 이동 없음)</text>

  <rect x="40" y="260" width="740" height="120" rx="8" fill="#eef5f7" stroke="#c7dce2" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="54" y="261" width="150" height="18" rx="9" fill="#d3e4ea"/>
  <text x="129" y="274" text-anchor="middle" font-size="10" fill="#1a4d5c" font-weight="600">정산 (settle) · 온체인</text>

  <line x1="160" y1="302" x2="410" y2="302" stroke="#2c7a8c" stroke-width="2" marker-end="url(#d6teal)"/>
  <rect x="178" y="291" width="218" height="22" rx="4" fill="#e8f1f4"/>
  <text x="287" y="306" text-anchor="middle" font-size="11" fill="#1a4d5c" font-weight="500">POST /settle (정산 요청)</text>

  <line x1="410" y1="334" x2="660" y2="334" stroke="#2c7a8c" stroke-width="2" marker-end="url(#d6teal)"/>
  <rect x="428" y="323" width="218" height="22" rx="4" fill="#e8f1f4"/>
  <text x="537" y="338" text-anchor="middle" font-size="10.5" fill="#1a4d5c" font-weight="500">transferWithAuthorization (가스 대납)</text>

  <line x1="660" y1="366" x2="410" y2="366" stroke="#4a8b6f" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#d6green)"/>
  <rect x="428" y="355" width="218" height="22" rx="4" fill="#f0f7f3"/>
  <text x="537" y="370" text-anchor="middle" font-size="11" fill="#4a8b6f" font-weight="500">확정 → 정산 완료 (tx hash)</text>

  <text x="410" y="410" text-anchor="middle" font-size="11" fill="#9ca3af">그림 — 어차피 실패할 요청엔 가스를 안 쓰는 구조가 초소액 결제의 경제성을 만든다</text>
</svg>
